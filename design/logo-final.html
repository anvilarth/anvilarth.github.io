<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Denoise mark — final</title>
<style>
:root{--bg:#f7f4ee;--t:#221d17;--ts:#5f574c;--ll:#e4ddd0;--accent:#c2552f;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
.dark{--bg:#16130f;--t:#ece5da;--ts:#b0a697;--ll:#332c23;--accent:#e07a4e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,sans-serif;background:#efeae1;padding:30px}
h1{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#756d64;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--bg);color:var(--t);border:1px solid var(--ll);border-radius:14px;padding:20px 22px}
.sizes{display:flex;align-items:flex-end;gap:22px;margin-bottom:18px}
figure{display:flex;flex-direction:column;align-items:center;gap:6px}
figcaption{font-family:var(--mono);font-size:9px;color:#8a8175}
svg{display:block}
.navbar{border-top:1px solid var(--ll);padding-top:14px;display:flex;align-items:center;gap:9px}
.wordmark{font-family:var(--mono);font-size:14px}
.wordmark b{font-weight:400;color:var(--accent)}
.navlinks{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ts)}
</style></head><body>
<h1>A · Denoise — refined for 16px</h1>
<div class="row" id="out"></div>

<template id="src">
<svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
  <circle cx="8"  cy="14" r="3"   opacity=".26"/>
  <circle cx="11" cy="33" r="3"   opacity=".26"/>
  <circle cx="8"  cy="50" r="3"   opacity=".26"/>
  <circle cx="23" cy="18" r="3.5" opacity=".5"/>
  <circle cx="25" cy="34" r="3.5" opacity=".5"/>
  <circle cx="22" cy="48" r="3.5" opacity=".5"/>
  <circle cx="38" cy="16" r="4"   opacity=".78"/>
  <circle cx="37" cy="32" r="4"   opacity=".78"/>
  <circle cx="38" cy="48" r="4"   opacity=".78"/>
  <rect x="49" y="9" width="8" height="46" rx="4"/>
</svg>
</template>

<script>
const src=document.getElementById('src').content.querySelector('svg');
const s=(px,color)=>{const n=src.cloneNode(true);n.setAttribute('width',px);n.setAttribute('height',px);n.style.color=color;return n.outerHTML};
const tile=(px,r)=>`<span style="width:${px}px;height:${px}px;background:var(--accent);border-radius:${r}px;display:grid;place-items:center">${s(px*0.78,'var(--bg)')}</span>`;
document.getElementById('out').innerHTML=[0,1].map(d=>`<div class="panel${d?' dark':''}">
  <div class="sizes">
    <figure>${s(64,'var(--accent)')}<figcaption>64</figcaption></figure>
    <figure>${s(32,'var(--accent)')}<figcaption>32</figcaption></figure>
    <figure>${s(20,'var(--accent)')}<figcaption>20 nav</figcaption></figure>
    <figure>${s(16,'var(--accent)')}<figcaption>16</figcaption></figure>
    <figure>${tile(64,14)}<figcaption>tile 64</figcaption></figure>
    <figure>${tile(32,7)}<figcaption>tile 32</figcaption></figure>
    <figure>${tile(16,3.5)}<figcaption>tile 16</figcaption></figure>
  </div>
  <div class="navbar">${s(19,'var(--accent)')}<span class="wordmark">andrei<b>filatov</b></span>
  <span class="navlinks">Projects &nbsp; Blog &nbsp; Talks &nbsp; Contact</span></div>
</div>`).join('');
</script>
</body></html>

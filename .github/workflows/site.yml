name: Site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Pin the runner image: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and the
# Lighthouse job relies on the browser preinstalled in the image. Bump on purpose.

# Superseded PR runs are cancelled; deploys of the live branch queue instead,
# because cancelling one would drop its Google / IndexNow submissions.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build + checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The sitemap takes lastmod from commit dates, so it needs the full history.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'

      - name: Build dist/
        run: uv run --frozen builder build

      - name: Run site checks
        run: uv run --frozen builder check

      # IndexNow sends the pages whose lastmod changed against what is live now,
      # so keep the current live sitemap before this deploy replaces it.
      - name: Save the live sitemap
        if: github.event_name != 'pull_request'
        run: curl -fsS "https://anvilarth.github.io/sitemap.xml?nocache=$(date +%s)" -o live-sitemap.xml || touch live-sitemap.xml

      - name: Keep the live sitemap for IndexNow
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: live-sitemap
          path: live-sitemap.xml

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    name: Lighthouse (${{ matrix.form-factor }})
    runs-on: ubuntu-24.04
    needs: build

    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'

      # Node and the browser both ship with the ubuntu runner image, so the job
      # needs no extra action; fail early and loudly if that ever changes.
      - name: Check the toolchain
        run: |
          node --version
          BIN="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then
            echo "::error::no browser on the runner; install one in this job"
            exit 1
          fi
          "$BIN" --version

      - name: Build dist/
        run: uv run --frozen builder build

      # CLS, a11y and SEO are hard budgets and fail the job; the performance
      # score and LCP/TBT only warn, because they track the runner's CPU.
      # The full table lands in the job summary. --chrome-profile keeps the
      # headless run in a dedicated --user-data-dir on the runner's scratch disk.
      - name: Lighthouse budgets
        run: |
          uv run --frozen builder perf \
            --form-factor ${{ matrix.form-factor }} \
            --runs 3 \
            --chrome-profile "$RUNNER_TEMP/lighthouse-chrome-profile"

  submit-sitemap:
    name: Submit sitemap to Google
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'

      - name: Build dist/
        run: uv run --frozen builder build

      # Waits (up to 10 min) for GitHub Pages to serve the new sitemap, then
      # resubmits it via the Search Console API. Skips cleanly while the
      # GSC_SERVICE_ACCOUNT secret is not configured.
      - name: Submit sitemap.xml
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: uv run --frozen --group seo builder submit-sitemap --wait

  indexnow:
    name: Ping IndexNow (Bing, Yandex)
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.12'

      - name: Build dist/
        run: uv run --frozen builder build

      - name: Get the sitemap that was live before this deploy
        uses: actions/download-artifact@v8
        with:
          name: live-sitemap

      # Sends the pages whose sitemap <lastmod> changed in this deploy, or that
      # are new in the sitemap, once Pages serves the key file. No secret
      # needed: the key is public by design and lives at /<key>.txt.
      - name: Send changed URLs
        run: uv run --frozen builder indexnow --wait --previous live-sitemap.xml
